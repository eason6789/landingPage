<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>情侣飞行棋 · 创想世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://font.emtech.cc/css/jfOpenHuninn" rel="stylesheet">
<style>
  :root{
    --brand:#CC1B1B;        /* 孩子气主色 · 朱砂红 */
    --brand-deep:#B31616;
    --brand-soft:#E9A6A6;
    --paper:#F5F0EB;        /* 奶油纸面 */
    --card:#FFFDF9;
    --ink:#1A1A1A;
    --ink-soft:#6B635A;
    --line:#E7DED3;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'jfOpenHuninn','Manrope','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(204,27,27,.05), transparent 42%),
      radial-gradient(circle at 88% 94%, rgba(204,27,27,.06), transparent 45%),
      var(--paper);
    color:var(--ink);
    min-height:100dvh;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* 散落涂鸦层（由 JS 注入） */
  .doodles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .doodles svg{position:absolute;color:var(--brand);}
  .screen{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px 16px 48px;}

  /* ---------- 顶部条 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-size:14px;font-weight:600;padding:9px 16px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;box-shadow:0 2px 6px rgba(26,26,26,.06);cursor:pointer;transition:.15s;
  }
  .back-btn:hover{background:#fff;}
  .back-btn:active{transform:translateY(1px);box-shadow:none;}
  .brand{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;}
  .brand svg{color:var(--brand);}

  /* ---------- 标题 ---------- */
  .hero{text-align:center;margin:6px 0 26px;}
  .hero .kicker{
    display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;
    color:var(--brand);letter-spacing:.18em;margin-bottom:12px;
  }
  .hero .kicker::before,.hero .kicker::after{content:"";width:28px;height:1.5px;background:var(--brand-soft);}
  .hero h1{
    font-size:clamp(2.3rem,7vw,3.7rem);font-weight:800;letter-spacing:.01em;line-height:1.08;
  }
  .hero h1 .heart{color:var(--brand);display:inline-block;animation:beat 1.4s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.18)}40%{transform:scale(1)}60%{transform:scale(1.12)}}
  .hero p{color:var(--ink-soft);font-size:15px;margin-top:14px;line-height:1.8;}

  /* ---------- 面板 ---------- */
  .panel{
    max-width:520px;margin:0 auto 16px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 6px 20px rgba(26,26,26,.06);padding:22px 20px;
  }
  .panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-title .t{font-size:1.2rem;font-weight:700;}
  .panel-title .v{font-size:20px;font-weight:800;color:var(--brand);}

  /* 温度滑块 */
  .temp-slider{width:100%;-webkit-appearance:none;appearance:none;height:16px;border-radius:999px;
    background:linear-gradient(90deg,#8ECDE3 0%,#F2C14E 33%,#EF7D58 67%,#C3365A 100%);
    outline:none;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);}
  .temp-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
    background:#fff;border:3px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;}
  .temp-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer;}
  .temp-labels{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .temp-readout{font-size:1.05rem;margin-top:16px;text-align:center;color:var(--ink);}

  /* 抽取比例 chips */
  .mix{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .mix-row{display:flex;align-items:center;gap:8px;}
  .mix-bar{flex:1;height:26px;border-radius:8px;border:1px solid var(--line);overflow:hidden;display:flex;background:var(--paper);}
  .mix-seg{height:100%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18);}
  .mix-total{font-size:13px;color:var(--ink-soft);text-align:right;margin-top:6px;}

  /* 图例 */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .lg-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);}
  .lg-dot{width:14px;height:14px;border-radius:5px;border:1px solid rgba(0,0,0,.12);}

  /* 人数选择 */
  .pcount{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .pcount-btn{
    width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.05);transition:.12s;
  }
  .pcount-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(204,27,27,.28);}
  .pcount-btn:active{transform:translateY(1px);}
  .pcount-hint{font-size:12px;color:var(--ink-soft);margin-top:12px;line-height:1.7;}
  .pc-chips{display:flex;gap:6px;margin-top:10px;}
  .pc-chip{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}

  .start-btn{
    display:block;width:100%;max-width:520px;margin:0 auto 8px;padding:18px;
    font-size:1.35rem;font-weight:800;background:var(--brand);color:#fff;border:none;border-radius:999px;
    box-shadow:0 8px 20px rgba(204,27,27,.30);cursor:pointer;transition:.15s;letter-spacing:.04em;
  }
  .start-btn:hover{background:var(--brand-deep);}
  .start-btn:active{transform:translateY(2px);box-shadow:0 4px 12px rgba(204,27,27,.28);}

  /* ---------- 游戏屏 ---------- */
  .game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .mode-badge{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:var(--card);
    border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.05);
    font-size:1.02rem;font-weight:700;
  }
  .turn-ind{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .turn-dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .legend-inline{max-width:460px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}

  .board-wrap{display:flex;justify-content:center;margin:6px 0 16px;}
  #board{position:relative;width:min(92vw,460px);aspect-ratio:1;margin:0 auto;}
  #board .tile{
    position:absolute;transform:translate(-50%,-50%);border-radius:12px;
    border:1px solid rgba(0,0,0,.10);display:grid;place-items:center;
    font-size:13px;font-weight:700;transition:transform .12s;box-shadow:0 2px 6px rgba(26,26,26,.12);
    cursor:pointer;
  }
  #board .tile.t-start{background:var(--brand);color:#fff;}
  #board .tile.t-finish{background:var(--ink);color:#fff;}
  #board .tile.cur{animation:tilepulse .8s ease-in-out infinite;z-index:3;box-shadow:0 0 0 3px var(--ink);}
  @keyframes tilepulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.14)}}
  #board .piece{
    position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    border:2px solid #fff;display:grid;place-items:center;
    font-size:13px;font-weight:700;z-index:5;transition:left .28s cubic-bezier(.3,.7,.4,1),top .28s cubic-bezier(.3,.7,.4,1);
    box-shadow:0 3px 8px rgba(26,26,26,.28);color:#fff;
  }

  /* ---------- 控制区 ---------- */
  .control-panel{
    max-width:460px;margin:0 auto;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 6px 20px rgba(26,26,26,.06);padding:16px 18px;
    display:flex;align-items:center;gap:16px;
  }
  #dice{
    width:64px;height:64px;flex:0 0 auto;border-radius:16px;border:1px solid var(--line);
    background:var(--paper);display:grid;place-items:center;
    font-size:28px;color:var(--brand);box-shadow:0 2px 6px rgba(26,26,26,.08);
  }
  #dice.rolling{animation:diceroll .5s linear infinite;}
  @keyframes diceroll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .roll-btn{
    flex:1;padding:16px 18px;font-size:1.15rem;font-weight:800;
    background:var(--brand);color:#fff;border:none;border-radius:14px;
    box-shadow:0 6px 16px rgba(204,27,27,.28);cursor:pointer;transition:.12s;letter-spacing:.04em;
  }
  .roll-btn:hover{background:var(--brand-deep);}
  .roll-btn:active{transform:translateY(2px);box-shadow:0 3px 10px rgba(204,27,27,.28);}
  .roll-btn:disabled{background:#CBB8A6;box-shadow:none;cursor:not-allowed;}
  .status-line{max-width:460px;margin:14px auto 0;text-align:center;color:var(--ink-soft);font-size:14px;min-height:20px;line-height:1.6;}

  /* ---------- 弹窗 ---------- */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(26,26,26,.4);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
  .modal.hidden{display:none;}
  .modal-card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(26,26,26,.25);
    width:min(92vw,400px);padding:28px 24px 22px;text-align:center;animation:pop .28s cubic-bezier(.3,1.4,.5,1);overflow:hidden;
  }
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-x{
    position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.12s;
  }
  .modal-x:hover{background:#fff;}
  .modal-x:active{transform:scale(.92);}
  .task-type{
    display:inline-block;padding:5px 14px;border-radius:999px;
    font-size:12px;font-weight:800;letter-spacing:.05em;margin-bottom:16px;color:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
  }
  .task-text{font-size:1.4rem;font-weight:700;line-height:1.6;margin-bottom:22px;color:var(--ink);}
  .modal-btn{
    width:100%;padding:14px;font-size:1.12rem;font-weight:800;
    background:var(--brand);color:#fff;border:none;border-radius:14px;
    box-shadow:0 6px 16px rgba(204,27,27,.28);cursor:pointer;transition:.12s;letter-spacing:.04em;
  }
  .modal-btn:hover{background:var(--brand-deep);}
  .modal-btn:active{transform:translateY(2px);}
  .modal-btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.06);margin-top:10px;}
  .win-big{font-size:46px;margin-bottom:6px;}
  .win-title{font-size:1.9rem;font-weight:800;margin-bottom:8px;}
  .win-sub{color:var(--ink-soft);font-size:14px;line-height:1.7;margin-bottom:18px;}

  /* ---------- 页脚 · 联系作者 ---------- */
  .footer{max-width:520px;margin:24px auto 0;text-align:center;color:var(--ink-soft);font-size:12px;}
  .author-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--brand);text-decoration:none;
    font-weight:800;font-size:13px;padding:9px 18px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);box-shadow:0 2px 6px rgba(26,26,26,.06);transition:.15s;
  }
  .author-link:hover{background:#fff;border-color:var(--brand-soft);}
  .author-link svg{color:var(--brand);}
  .footer .copy{margin-top:12px;}

  .hidden{display:none!important;}
</style>
</head>

  /* DOM 引用（必须在顶层 addEventListener 之前声明） */
  var menuScreen = $('menuScreen'), gameScreen = $('gameScreen');
  var boardEl = $('board'), diceEl = $('dice'), rollBtn = $('rollBtn');
  var statusEl = $('statusLine'), turnDot = $('turnDot'), turnText = $('turnText');
  var modeIco = $('modeIco'), modeLabel = $('modeLabel');
  var taskModal = $('taskModal'), taskType = $('taskType'), taskText = $('taskText'), taskDone = $('taskDone');
  var winModal = $('winModal'), winTitle = $('winTitle'), winSub = $('winSub');

  function shuffle(a){
    a = a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  /* =========================================================
     温度 → 每档抽取题数（四舍五入）
     ========================================================= */
  function tempMix(T){
    var A = [0, 100/3, 200/3, 100];
    var span = 100/3;
    var w = A.map(function(a){ return Math.max(0, 1 - Math.abs(T - a) / span); });
    var s = w.reduce(function(x,y){ return x+y; }, 0) || 1;
    var counts = w.map(function(x){ return Math.round(DECK * x / s); });
    // 修正到正好 30
    var total = counts.reduce(function(x,y){ return x+y; }, 0);
    var diff = DECK - total;
    if(diff !== 0){
      var idx = counts.indexOf(Math.max.apply(null, counts));
      counts[idx] = Math.max(0, counts[idx] + diff);
    }
    // 夹取到每档可用题数
    counts = counts.map(function(c,i){ return Math.min(c, TIERS[i].items.length); });
    return counts;
  }

  function tempName(T){
    if(T < 12) return '清纯';
    if(T < 37) return '微醺';
    if(T < 62) return '燥热';
    return '沸腾';
  }
  function tempEmoji(T){ return T < 25 ? '❄️' : T < 50 ? '🌤️' : T < 75 ? '🔥' : '♨️'; }

  function buildPool(T){
    var counts = tempMix(T);
    var pool = [];
    counts.forEach(function(c, i){
      shuffle(TIERS[i].items).slice(0, c).forEach(function(txt){
        pool.push({ tier:i, text:txt });
      });
    });
    return shuffle(pool);
  }

  /* =========================================================
     菜单：温度滑块 + 抽取比例 + 图例 + 人数
     ========================================================= */
  var playerCount = 2;

  function renderLegend(el){
    el.innerHTML = '';
    TIERS.forEach(function(t){
      var d = document.createElement('span');
      d.className = 'lg-item';
      d.innerHTML = '<span class="lg-dot" style="background:'+t.color+'"></span>'+
                    t.emoji+' '+t.name+' · '+t.scene+'（'+t.items.length+'题）';
      el.appendChild(d);
    });
  }

  function renderMix(){
    var T = +$('tempSlider').value;
    var counts = tempMix(T);
    $('tempVal').textContent = T + '%';
    $('tempReadout').textContent = tempEmoji(T) + ' ' + tempName(T) + ' · 本局从四个题库共抽 ' + DECK + ' 题';

    var bar = $('mixBar');
    bar.innerHTML = '';
    var shown = 0;
    counts.forEach(function(c, i){
      if(c <= 0) return;
      var seg = document.createElement('div');
      seg.className = 'mix-seg';
      seg.style.width = (c / DECK * 100) + '%';
      seg.style.background = TIERS[i].color;
      seg.style.color = TIERS[i].text;
      seg.textContent = TIERS[i].emoji + ' ' + c;
      bar.appendChild(seg);
      shown += c;
    });
    var detail = counts.map(function(c,i){
      return TIERS[i].name + ' ' + c + '题';
    }).filter(function(s){ return s.indexOf(' 0题') < 0; }).join(' · ');
    $('mixTotal').textContent = detail + ' · 合计 ' + shown + ' 题';
  }

  function renderPcount(){
    var row = $('pcountRow');
    row.innerHTML = '';
    for(var n=2; n<=6; n++){
      var b = document.createElement('button');
      b.className = 'pcount-btn' + (n === playerCount ? ' active' : '');
      b.textContent = n;
      b.addEventListener('click', function(nn){ return function(){ playerCount = nn; renderPcount(); }; }(n));
      row.appendChild(b);
    }
    var chips = $('pcChips');
    chips.innerHTML = '';
    for(var k=0;k<playerCount;k++){
      var c = document.createElement('span');
      c.className = 'pc-chip';
      c.style.background = PLAYER_COLORS[k];
      chips.appendChild(c);
    }
  }

  $('tempSlider').addEventListener('input', renderMix);
  $('startBtn').addEventListener('click', function(){ startGame(+$('tempSlider').value, playerCount); });

  /* =========================================================
     开始游戏
     ========================================================= */
  function startGame(T, n){
    winModal.classList.add('hidden');
    taskModal.classList.add('hidden');
    state = {
      temp: T,
      players: [],
      current: 0,
      rolling: false,
      finished: false,
      board: []
    };
    for(var i=0;i<n;i++){
      state.players.push({ name: PLAYER_NAMES[i]+'方', pos: START, color: PLAYER_COLORS[i], icon:'♥' });
    }
    // 分配题目到 30 个格子
    var pool = buildPool(T);
    for(var t=0; t<TILE_COUNT; t++){
      if(t === START || t === FINISH) state.board[t] = null;
      else state.board[t] = pool[t-1];
    }

    $('modeIco').textContent = tempEmoji(T);
    $('modeLabel').textContent = tempName(T) + ' · ' + T + '%';
    renderLegendInline();
    menuScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    renderBoard();
    updateTurn();
    setStatus(state.players[0].name + '先走，点击「掷骰子」');
    rollBtn.disabled = false;
    rollBtn.textContent = '掷骰子';
  }

  function renderLegendInline(){
    var el = $('legendInline');
    el.innerHTML = '';
    var counts = tempMix(state.temp);
    counts.forEach(function(c,i){
      if(c <= 0) return;
      var s = document.createElement('span');
      s.className = 'lg-item';
      s.innerHTML = '<span class="lg-dot" style="background:'+TIERS[i].color+'"></span>'+TIERS[i].emoji+' '+TIERS[i].name+' ×'+c;
      el.appendChild(s);
    });
  }

  /* =========================================================
     渲染棋盘
     ========================================================= */
  var boardSize = 0, tilePx = 0;
  function renderBoard(){
    boardEl.innerHTML = '';
    var w = boardEl.clientWidth || Math.min(window.innerWidth*0.92, 460);
    boardSize = w;
    var ts = w / 9;
    tilePx = Math.round(ts * 0.76);
    for(var i=0;i<TILE_COUNT;i++){
      var xy = tileXY(i);
      var d = document.createElement('div');
      if(i === START) d.className = 'tile t-start';
      else if(i === FINISH) d.className = 'tile t-finish';
      else {
        d.className = 'tile';
        var task = state.board[i];
        d.style.background = TIERS[task.tier].color;
        d.style.color = TIERS[task.tier].text;
      }
      d.style.width = tilePx+'px';
      d.style.height = tilePx+'px';
      d.style.left = xy.x+'px';
      d.style.top = xy.y+'px';
      d.style.fontSize = Math.max(12, Math.round(tilePx*0.42))+'px';
      d.textContent = tileLabel(i);
      d.setAttribute('data-tile', i);
      bindPeek(d, i);
      boardEl.appendChild(d);
    }
    // 中央提示区
    var center = document.createElement('div');
    center.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:58%;';
    center.innerHTML = '<div style="font-size:34px;color:#CC1B1B;">♥</div>'+
                       '<div style="font-family:\'jfOpenHuninn\',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;color:#6B635A;margin-top:2px;">COUPLE FLIGHT</div>'+
                       '<div style="font-size:12px;color:#6B635A;margin-top:6px;">点击或长按格子查看题目</div>';
    boardEl.appendChild(center);
    // 棋子
    state.players.forEach(function(p, idx){
      var el = document.createElement('div');
      el.className = 'piece';
      el.id = 'piece'+idx;
      el.textContent = p.icon;
      el.style.background = p.color;
      el.style.width = (tilePx*0.72)+'px';
      el.style.height = (tilePx*0.72)+'px';
      el.style.fontSize = (tilePx*0.4)+'px';
      boardEl.appendChild(el);
    });
    positionPieces();
  }

  function tileXY(i){
    var ts = boardSize / 9;
    var half = ts / 2;
    var inner = boardSize - ts;
    var step = inner / 8;
    if(i === 0)  return {x: half, y: boardSize - half};
    if(i === 8)  return {x: half, y: half};
    if(i === 16) return {x: boardSize - half, y: half};
    if(i === 24) return {x: boardSize - half, y: boardSize - half};
    if(i < 8)  return {x: half, y: boardSize - half - i * step};
    if(i < 16) return {x: half + (i - 8) * step, y: half};
    if(i < 24) return {x: boardSize - half, y: half + (i - 16) * step};
    return {x: boardSize - half - (i - 24) * step, y: boardSize - half};
  }
  function tileLabel(i){
    if(i === START) return '起';
    if(i === FINISH) return '终';
    return String(i);
  }
  function pieceOffset(idx, n){
    if(n <= 2) return { x:(idx===0?-1:1)*tilePx*0.16, y:0 };
    var ang = (idx / n) * Math.PI*2 - Math.PI/2;
    var r = tilePx*0.24;
    return { x: Math.cos(ang)*r, y: Math.sin(ang)*r };
  }
  function positionPieces(){
    state.players.forEach(function(p, idx){
      var el = $('piece'+idx);
      var xy = tileXY(p.pos);
      var off = pieceOffset(idx, state.players.length);
      el.style.left = (xy.x + off.x)+'px';
      el.style.top = (xy.y + off.y)+'px';
    });
  }
  function markCurrentTile(){
    var tiles = boardEl.querySelectorAll('.tile');
    for(var i=0;i<tiles.length;i++){ tiles[i].classList.remove('cur'); }
    var p = state.players[state.current];
    var t = boardEl.querySelector('.tile[data-tile="'+p.pos+'"]');
    if(t) t.classList.add('cur');
  }

  /* =========================================================
     点击 / 长按查看题目
     ========================================================= */
  function bindPeek(el, i){
    var longFired = false, timer = null;
    function open(){ showPeek(i); }
    el.addEventListener('touchstart', function(){
      longFired = false;
      timer = setTimeout(function(){ longFired = true; open(); }, 450);
    }, {passive:true});
    el.addEventListener('touchend', function(){ clearTimeout(timer); });
    el.addEventListener('touchmove', function(){ clearTimeout(timer); });
    el.addEventListener('click', function(){ clearTimeout(timer); if(!longFired) open(); });
  }

  function showPeek(i){
    if(i === START || i === FINISH) return;
    var task = state.board[i];
    openTaskModal(task, '第 ' + i + ' 格', false);
  }

  /* =========================================================
     回合指示
     ========================================================= */
  function updateTurn(){
    var p = state.players[state.current];
    turnDot.style.background = p.color;
    turnText.textContent = p.name + '回合';
    markCurrentTile();
  }
  function setStatus(s){ statusEl.textContent = s; }

  /* =========================================================
     掷骰子 + 移动
     ========================================================= */
  rollBtn.addEventListener('click', function(){
    if(state.rolling || state.finished) return;
    state.rolling = true;
    rollBtn.disabled = true;
    diceEl.classList.add('rolling');
    var p = state.players[state.current];
    var roll = Math.floor(Math.random()*6)+1;
    var finalPos = Math.min(p.pos + roll, FINISH);
    setTimeout(function(){
      diceEl.classList.remove('rolling');
      diceEl.textContent = '⚀⚁⚂⚃⚄⚅'[roll-1] || roll;
      moveStep(p, p.pos, finalPos, roll);
    }, 520);
  });

  function moveStep(p, from, to, roll){
    var step = from < to ? 1 : -1;
    var i = from;
    (function next(){
      if(step > 0 ? i >= to : i <= to){
        p.pos = to;
        positionPieces();
        if(to >= FINISH){
          state.finished = true;
          setStatus(p.name + ' 到达终点！');
          setTimeout(showWin, 400);
          return;
        }
        setTimeout(function(){ onLand(p); }, 350);
        return;
      }
      i += step;
      p.pos = i;
      positionPieces();
      setTimeout(next, 240);
    })();
  }

  function onLand(p){
    var task = state.board[p.pos];
    openTaskModal(task, p.name + ' 落点', true);
  }

  /* =========================================================
     弹窗
     ========================================================= */
  var pendingTurn = false;
  function openTaskModal(task, label, isLand){
    taskType.textContent = TIERS[task.tier].emoji + ' ' + TIERS[task.tier].name + ' · ' + label;
    taskType.style.background = TIERS[task.tier].color;
    taskType.style.color = TIERS[task.tier].text;
    taskText.textContent = task.text;
    taskDone.textContent = isLand ? '完成 ✓ 交给下一位' : '知道了';
    pendingTurn = isLand;
    taskModal.classList.remove('hidden');
  }
  function closeTask(){
    taskModal.classList.add('hidden');
    if(pendingTurn){ pendingTurn = false; nextTurn(); }
  }
  $('taskDone').addEventListener('click', closeTask);
  $('modalX').addEventListener('click', closeTask);

  function nextTurn(){
    if(state.finished) return;
    state.current = (state.current + 1) % state.players.length;
    updateTurn();
    setStatus(state.players[state.current].name + ' 的回合');
    rollBtn.disabled = false;
    rollBtn.textContent = '掷骰子';
    state.rolling = false;
  }

  function showWin(){
    var p = state.players[state.current];
    var others = state.players.length - 1;
    winTitle.textContent = p.name + '获胜！';
    winSub.textContent = '🎉 ' + p.name + ' 率先通关！现在你可以向' +
      (others > 1 ? '其他每一位玩家' : '对方') + '提出任何一个要求 ♥';
    winModal.classList.remove('hidden');
  }
  $('winAgain').addEventListener('click', function(){ startGame(state.temp, state.players.length); });
  $('winMenu').addEventListener('click', function(){
    winModal.classList.add('hidden');
    gameScreen.classList.add('hidden');
    menuScreen.classList.remove('hidden');
  });
  $('winX').addEventListener('click', function(){ winModal.classList.add('hidden'); });
  $('backToMenu').addEventListener('click', function(){
    gameScreen.classList.add('hidden');
    menuScreen.classList.remove('hidden');
  });

  // 点击遮罩关闭任务弹窗
  taskModal.addEventListener('click', function(e){ if(e.target === taskModal) closeTask(); });

  /* =========================================================
     响应式
     ========================================================= */
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if(!gameScreen.classList.contains('hidden') && state){ renderBoard(); }
    }, 200);
  });

  scatterDoodles();
  renderLegend($('legend'));
  renderMix();
  renderPcount();
})();
</script>
</body>
</html>
