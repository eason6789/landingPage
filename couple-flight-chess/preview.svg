  <!-- 标题 -->
  <text x="60" y="80" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="44" font-weight="800" fill="#1A1A1A">情侣飞行棋</text>
  <text x="60" y="116" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#6B635A">掷骰子走格子 · 一档无极调温度</text>

  <!-- 骰子 -->
  <g transform="translate(448,64)">
    <rect width="92" height="92" rx="22" fill="#FFFDF9" stroke="#E7DED3" stroke-width="2"/>
    <circle cx="30" cy="30" r="8" fill="#CC1B1B"/>
    <circle cx="62" cy="62" r="8" fill="#CC1B1B"/>
    <circle cx="30" cy="62" r="8" fill="#CC1B1B"/>
    <circle cx="62" cy="30" r="8" fill="#CC1B1B"/>
  </g>

