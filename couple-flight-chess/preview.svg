<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6EF"/>
      <stop offset="1" stop-color="#F3E7D3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- 像素网格 -->
  <g fill="#78350F" opacity="0.05">
    <path d="M0 40h600M0 80h600M0 120h600M0 160h600M0 200h600M0 240h600M0 280h600M0 320h600M0 360h600"/>
    <path d="M40 0v400M80 0v400M120 0v400M160 0v400M200 0v400M240 0v400M280 0v400M320 0v400M360 0v400M400 0v400M440 0v400M480 0v400M520 0v400M560 0v400"/>
  </g>

  <!-- 大像素爱心（左） -->
  <g transform="translate(150,120)">
    <rect x="0"  y="20" width="32" height="32" fill="#E8593D"/>
    <rect x="32" y="20" width="32" height="32" fill="#E8593D"/>
    <rect x="64" y="20" width="32" height="32" fill="#E8593D"/>
    <rect x="96" y="20" width="32" height="32" fill="#E8593D"/>
    <rect x="128" y="20" width="32" height="32" fill="#E8593D"/>
    <rect x="160" y="20" width="32" height="32" fill="#E8593D"/>
    <rect x="0"  y="52" width="32" height="32" fill="#E8593D"/>
    <rect x="192" y="52" width="32" height="32" fill="#E8593D"/>
    <rect x="0"  y="84" width="32" height="32" fill="#E8593D"/>
    <rect x="224" y="84" width="32" height="32" fill="#E8593D"/>
    <rect x="0"  y="116" width="32" height="32" fill="#E8593D"/>
    <rect x="256" y="116" width="32" height="32" fill="#E8593D"/>
    <rect x="32" y="148" width="32" height="32" fill="#E8593D"/>
    <rect x="224" y="148" width="32" height="32" fill="#E8593D"/>
    <rect x="64" y="180" width="32" height="32" fill="#E8593D"/>
    <rect x="192" y="180" width="32" height="32" fill="#E8593D"/>
    <rect x="96" y="212" width="32" height="32" fill="#E8593D"/>
    <rect x="160" y="212" width="32" height="32" fill="#E8593D"/>
    <rect x="128" y="244" width="32" height="32" fill="#E8593D"/>
    <rect x="112" y="96" width="24" height="40" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- 像素骰子（右上） -->
  <g transform="translate(360,80)">
    <rect x="0" y="0" width="120" height="120" rx="10" fill="#FFFFFF" stroke="#2E1E16" stroke-width="6"/>
    <rect x="24" y="24" width="24" height="24" fill="#D97706"/>
    <rect x="72" y="72" width="24" height="24" fill="#D97706"/>
    <rect x="24" y="72" width="24" height="24" fill="#78350F"/>
    <rect x="72" y="24" width="24" height="24" fill="#78350F"/>
  </g>

  <!-- 像素飞机/棋子（右下） -->
  <g transform="translate(390,250)">
    <rect x="20" y="0" width="48" height="48" fill="#78350F"/>
    <rect x="44" y="48" width="48" height="48" fill="#78350F"/>
    <rect x="20" y="48" width="24" height="48" fill="#78350F"/>
    <rect x="92" y="48" width="24" height="48" fill="#78350F"/>
    <rect x="20" y="96" width="96" height="24" fill="#78350F"/>
    <rect x="32" y="60" width="16" height="16" fill="#E8593D"/>
    <rect x="72" y="60" width="16" height="16" fill="#E8593D"/>
    <rect x="52" y="108" width="24" height="12" fill="#D97706"/>
  </g>

  <!-- 连接路径的小格子 -->
  <g>
    <rect x="470" y="80"  width="36" height="36" fill="#FBE0EA" stroke="#2E1E16" stroke-width="4"/>
    <rect x="520" y="130" width="36" height="36" fill="#FDE2DC" stroke="#2E1E16" stroke-width="4"/>
    <rect x="470" y="180" width="36" height="36" fill="#DCEAD9" stroke="#2E1E16" stroke-width="4"/>
    <rect x="420" y="230" width="36" height="36" fill="#F1E0F4" stroke="#2E1E16" stroke-width="4"/>
    <rect x="520" y="230" width="36" height="36" fill="#FBF0D2" stroke="#2E1E16" stroke-width="4"/>
  </g>
</svg>
