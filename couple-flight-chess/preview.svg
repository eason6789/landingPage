      <path transform="translate(560,260) scale(1.1)" d="M12 12.5m-1.8 0a1.8 1.8 0 1 0 3.6 0 1.8 1.8 0 1 0-3.6 0 M12 5.5c1.6 1.8 1.6 3.6 0 5-1.6-1.4-1.6-3.2 0-5z M18.5 12c-1.8 1.6-3.6 1.6-5 0 1.4-1.6 3.2-1.6 5 0z M12 18.5c-1.6-1.8-1.6-3.6 0-5 1.6 1.4 1.6 3.2 0 5z M5.5 12c1.8-1.6 3.6-1.6 5 0-1.4 1.6-3.2 1.6-5 0z"/>
      <path transform="translate(30,60) scale(1.3)" d="M12 20v-7 M12 13c0-3 2.2-5 5.5-5 0 3.2-2.3 5-5.5 5z M12 13c0-3-2.2-5-5.5-5 0 3.2 2.3 5 5.5 5z"/>
    </g>
  </g>

  <!-- 大爱心 -->
  <g transform="translate(150,140) scale(11)">
    <path fill="#CC1B1B" d="M12 20.2c-4.6-3.1-8-6.3-8-10.1 0-2.9 2.2-5.1 5-5.1 1.3 0 2.5.6 3 1.6.5-1 1.7-1.6 3-1.6 2.8 0 5 2.2 5 5.1 0 3.8-3.4 7-8 10.1z"/>
