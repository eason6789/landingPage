    <rect x="160" y="318" width="84" height="52" rx="14" fill="#F2C14E"/>
    <rect x="260" y="318" width="84" height="52" rx="14" fill="#EF7D58"/>
    <rect x="360" y="318" width="84" height="52" rx="14" fill="#C3365A"/>
