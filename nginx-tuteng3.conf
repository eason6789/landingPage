server {
    listen 80;
    server_name tuteng3.site www.tuteng3.site 119.29.178.222;

    root /root/project/portfolio-home/src;
    index index.html index.htm;

    # PHP-FPM for video-feed (exact match - nginx built without PCRE)
    location = /video-feed/api.php {
        fastcgi_pass   php-fpm;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  /var/www/videos-feed/api.php;
    }
    location = /video-feed/check.php {
        fastcgi_pass   php-fpm;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  /var/www/videos-feed/check.php;
    }
    location = /video-feed/verify.php {
        fastcgi_pass   php-fpm;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  /var/www/videos-feed/verify.php;
    }
    location = /video-feed/list.php {
        fastcgi_pass   php-fpm;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  /var/www/videos-feed/list.php;
    }

    # Video Feed - independent project
    location ^~ /video-feed/ {
        alias /var/www/videos-feed/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Vocab Duo - AI单词学习应用
    location ^~ /vocab-duo/ {
        alias /var/www/vocab-duo/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /vocab-duo/index.html;
    }

    # Vocab Duo API 代理
    location ^~ /vocab-duo/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }

    # Vocab Duo 上传文件
    location ^~ /vocab-duo/uploads/ {
        alias /var/www/vocab-duo/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # music_gen 前端 (子目录部署)
    location ^~ /music_gen/ {
        root /www/wwwroot;
        index index.html;
        try_files $uri $uri/ /music_gen/index.html;
    }

    # music_gen API 代理
    location /music/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        client_max_body_size 55m;
    }

    # Finc Study - 金融知识学习平台
    location ^~ /finlearn/ {
        alias /var/www/html/finlearn/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Claw Management - 后台管理
    location ^~ /claw/management/ {
        alias /var/www/claw-mgmt/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ID Photo - AI证件照 (frontend)
    location ^~ /claw/photo/ {
        alias /var/www/id-photo/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /game.html {
        alias /root/project/codenames-game/src/game.html;
    }

    # HTML 缓存控制
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 结果图片静态服务
    location /claw/api/data/results/ {
        alias /var/www/html/claw/api/data/results/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # claw API 代理 (id-photo 后端 8080)
    location /claw/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        client_max_body_size 10m;
    }

    # Go API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        client_max_body_size 10m;
    }
}

server {
