<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy虾工具箱</title>
    <style>
        :root {
            --color-bg-base: #0f1419;
            --color-bg-elevated: #161d26;
            --color-bg-surface: #1e2732;
            --color-text-primary: #e7e9ea;
            --color-text-secondary: #8b98a5;
            --color-accent-primary: #1d9bf0;
            --color-accent-success: #00ba7c;
            --color-border-default: #2f3b47;
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
            --radius-lg: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--color-bg-base);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 */
        .navbar {
            background: var(--color-bg-elevated);
            border-bottom: 1px solid var(--color-border-default);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .navbar-brand .logo {
            font-size: 24px;
        }

        .navbar-menu {
            display: flex;
            gap: 16px;
        }

        .nav-link {
            color: var(--color-text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: var(--color-text-primary);
            background: var(--color-bg-surface);
        }

        /* 主内容区 */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .welcome-card {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 48px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .welcome-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .welcome-desc {
            color: var(--color-text-secondary);
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .tool-card {
            background: var(--color-bg-surface);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: var(--color-text-primary);
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .tool-card:hover {
            border-color: var(--color-accent-primary);
            transform: translateY(-2px);
        }

        .tool-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .tool-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .tool-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .tool-status {
            margin-top: 12px;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: rgba(0, 186, 124, 0.1);
            color: var(--color-accent-success);
        }

        @media (max-width: 640px) {
            .navbar-menu {
                display: none;
            }
            
            .welcome-card {
                padding: 32px 24px;
            }
            
            .welcome-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <span class="logo">🦐</span>
            <span>Buddy虾工具箱</span>
        </div>
        <div class="navbar-menu">
            <a href="/claw/photo/" class="nav-link">证件照生成</a>
            <a href="/finlearn/" class="nav-link">金融学习</a>
            <a href="/claw/management/" class="nav-link">管理面板</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="welcome-card">
            <div class="welcome-icon">🦐</div>
            <h1 class="welcome-title">Buddy虾工具箱</h1>
            <p class="welcome-desc">
                由Buddy虾团队打造的智能工具集合，为您提供便捷的在线服务
            </p>
            <div class="tool-grid">
                <a href="/claw/photo/" class="tool-card">
                    <div class="tool-icon">📸</div>
                    <div class="tool-name">证件照生成</div>
                    <div class="tool-desc">上传自拍，AI自动生成标准证件照</div>
                    <span class="tool-status">在线</span>
                </a>
                <a href="/finlearn/" class="tool-card">
                    <div class="tool-icon">📚</div>
                    <div class="tool-name">金融学习平台</div>
                    <div class="tool-desc">系统化金融知识体系，10大模块循序渐进</div>
                    <span class="tool-status">在线</span>
                </a>
                <a href="/claw/management/" class="tool-card">
                    <div class="tool-icon">📊</div>
                    <div class="tool-name">管理面板</div>
                    <div class="tool-desc">监控三只龙虾的工作状态</div>
                    <span class="tool-status">在线</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
