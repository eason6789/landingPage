<!DOCTYPE html>
<html>
<head>
    <title>OpenClaw API 测试</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>OpenClaw API 测试</h1>
    <button onclick="testAPI()">测试 API</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = '测试中...';

            try {
                console.log('开始请求...');
                const response = await fetch('/claw/api/status');
                console.log('响应状态:', response.status);
                console.log('响应头:', response.headers);

                const text = await response.text();
                console.log('响应文本前100字符:', text.substring(0, 100));

                const data = JSON.parse(text);
                resultEl.textContent = '✅ 成功！\n\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('错误:', error);
                resultEl.textContent = '❌ 失败：' + error.message + '\n\n' + error.stack;
            }
        }

        // 自动运行
        window.onload = () => testAPI();
    </script>
</body>
</html>
