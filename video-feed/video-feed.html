<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* 密码页 */
    .password-page {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .password-box {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      width: 320px;
    }

    .password-box h2 {
      color: #333;
      margin-bottom: 24px;
      font-size: 24px;
    }

    .password-box input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .password-box input:focus {
      border-color: #667eea;
    }

    .password-box button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .password-box button:hover {
      transform: scale(1.02);
    }

    .password-box button:active {
      transform: scale(0.98);
    }

    .password-error {
      color: #e74c3c;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }

    /* 小红书风格网格页 */
    .grid-page {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      display: none;
    }

    .grid-page.active {
      display: block;
    }

    .grid-page h1 {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .grid-item {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .grid-item:active {
      transform: scale(0.98);
    }

    .grid-item video {
      width: 100%;
      aspect-ratio: 9/16;
      object-fit: cover;
      background: #000;
      -webkit-appearance: none;
      appearance: none;
    }

    .grid-item video::-webkit-media-controls {
      display: none !important;
    }

    .grid-item video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    .grid-item-info {
      padding: 10px;
    }

    .grid-item-title {
      font-size: 13px;
      color: #333;
      line-height: 1.4;
      text-align: center;
    }

    /* 抖音全屏feed页 */
    .feed-page {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 1000;
      display: none;
    }

    .feed-page.active {
      display: block;
    }

    .feed-container {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .feed-container::-webkit-scrollbar {
      display: none;
    }

    .feed-item {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
    }

    .feed-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .feed-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      font-size: 24px;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feed-index {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 1001;
    }

    .feed-title {
      position: absolute;
      bottom: 80px;
      left: 16px;
      right: 60px;
      color: #fff;
      font-size: 15px;
      line-height: 1.5;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
<!-- 小红书网格页 -->
  <div class="grid-page" id="gridPage">
    <h1>AI助手</h1>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <!-- 抖音全屏Feed页 -->
  <div class="feed-page" id="feedPage">
    <button class="feed-close" id="feedClose">×</button>
    <div class="feed-index" id="feedIndex">1 / 10</div>
    <div class="feed-container" id="feedContainer"></div>
  </div>

  <script>
    // 无需密码，直接展示
    document.getElementById('passwordPage')?.remove();
    document.getElementById('gridPage').classList.add('active');
    renderGrid();
    renderFeed();

    // 竖版视频列表
    const videos = [
      'sd1777626106_2.MP4',
      'sd1777641200_2.MP4',
      'sd1777646363_2.MP4',
      'v1e00fgi0000cu5rc4vog65l5ioohc80.MP4'
    ];

    // 生成10个视频（循环使用4个）
    const videoList = Array.from({ length: 10 }, (_, i) => ({
      index: i,
      src: videos[i % videos.length],
      title: String((i % 4) + 1)
    }));

    // 视频文件夹（相对路径）
    const videoPath = 'videos/';
    // 服务器部署路径
    const basePath = '/video-feed/';

    // 渲染网格
    function renderGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = videoList.map(v => `
        <div class="grid-item" data-index="${v.index}">
          <video src="${basePath}${videoPath}${v.src}" muted loop playsinline></video>
          <div class="grid-item-info">
            <div class="grid-item-title">${v.title}</div>
          </div>
        </div>
      `).join('');

      // 网格项点击
      grid.querySelectorAll('.grid-item').forEach(item => {
        item.addEventListener('click', () => {
          const index = parseInt(item.dataset.index);
          openFeed(index);
        });
      });

      // 网格视频hover播放
      grid.querySelectorAll('video').forEach(video => {
        video.addEventListener('mouseenter', () => video.play());
        video.addEventListener('mouseleave', () => video.pause());
      });
    }

    // 渲染Feed流
    function renderFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = videoList.map(v => `
        <div class="feed-item" data-index="${v.index}">
          <video src="${basePath}${videoPath}${v.src}" muted loop playsinline></video>
          <div class="feed-title">${v.title}</div>
        </div>
      `).join('');

      // 监听滚动切换视频
      let currentIndex = 0;
      const items = container.querySelectorAll('.feed-item');
      const feedVideos = container.querySelectorAll('video');

      function updateIndex() {
        const scrollTop = container.scrollTop;
        const viewportHeight = window.innerHeight;
        currentIndex = Math.round(scrollTop / viewportHeight);
        document.getElementById('feedIndex').textContent = `${currentIndex + 1} / ${videoList.length}`;
      }

      container.addEventListener('scroll', () => {
        updateIndex();
        // 暂停其他视频，播放当前视频
        feedVideos.forEach((v, i) => {
          if (i === currentIndex) {
            v.play().catch(() => {});
            items[i].classList.add('playing');
          } else {
            v.pause();
            items[i].classList.remove('playing');
          }
        });
      });
    }

    // 打开Feed页
    function openFeed(index) {
      const feedPage = document.getElementById('feedPage');
      const container = document.getElementById('feedContainer');
      feedPage.classList.add('active');
      container.scrollTop = index * window.innerHeight;

      // 播放当前视频
      setTimeout(() => {
        const feedVideos = container.querySelectorAll('video');
        feedVideos[index]?.play().catch(() => {});
        container.querySelectorAll('.feed-item')[index]?.classList.add('playing');
        document.getElementById('feedIndex').textContent = `${index + 1} / ${videoList.length}`;
      }, 100);
    }

    // 关闭Feed页
    document.getElementById('feedClose').addEventListener('click', () => {
      const feedPage = document.getElementById('feedPage');
      feedPage.classList.remove('active');
      // 停止所有feed视频
      document.querySelectorAll('#feedContainer video').forEach(v => v.pause());
    });
  </script>
</body>
</html>
