<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Demo列表</title>
  <style>
    :root {
      --bg-primary: #1a1a1a;
      --bg-card: #2d2d2d;
      --text-primary: #fff;
      --text-secondary: #aaa;
      --accent: #8b5cf6;
      --accent-end: #a855f7;
      --like-color: #f87171;
      --like-inactive: rgba(255,255,255,0.6);
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --bg-card: #fff;
      --text-primary: #333;
      --text-secondary: #666;
      --accent: #667eea;
      --accent-end: #764ba2;
      --like-color: #e74c3c;
      --like-inactive: #ccc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      transition: background 0.3s;
    }

    /* 加载动画 */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
      display: none;
    }

    .loading-spinner.show {
      display: block;
    }

    .feed-item .loading-spinner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 密码页 */
    .password-page {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-end) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .password-box {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      width: 320px;
    }

    .password-box h2 { color: #333; margin-bottom: 24px; font-size: 24px; }

    .password-box input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .password-box input:focus { border-color: var(--accent); }

    .password-box button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-end) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .password-box button:hover { transform: scale(1.02); }
    .password-box button:active { transform: scale(0.98); }
    .password-error { color: #e74c3c; margin-top: 16px; font-size: 14px; display: none; }

    /* 网格页 */
    .grid-page { padding: 16px; max-width: 600px; margin: 0 auto; display: none; }
    .grid-page.active { display: block; }

    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .grid-page h1 { font-size: 20px; font-weight: 600; color: var(--text-primary); }

    .grid-actions { display: flex; gap: 8px; }

    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .action-btn:active { transform: scale(0.95); }
    .action-btn.liked { color: var(--like-color); }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .grid-item {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .grid-item:active { transform: scale(0.98); }
    .grid-item.liked { box-shadow: 0 0 0 2px var(--like-color); }

    .grid-item-video {
      position: relative;
      background: #000;
    }

    .grid-item video {
      width: 100%;
      aspect-ratio: 9/16;
      object-fit: cover;
      background: #000;
      -webkit-appearance: none;
      appearance: none;
      display: block;
    }

    .grid-item video::-webkit-media-controls { display: none !important; }
    .grid-item video::-webkit-media-controls-enclosure { display: none !important; }

    .grid-item-info {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-item-title { font-size: 13px; color: var(--text-primary); line-height: 1.4; }

    .grid-item-like-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .grid-item-like {
      font-size: 16px;
      cursor: pointer;
      color: var(--like-inactive);
      transition: color 0.2s, transform 0.2s;
    }

    .grid-item-like.liked { color: var(--like-color); transform: scale(1.2); }

    .grid-item-count {
      font-size: 13px;
      color: var(--text-secondary);
      min-width: 16px;
    }

    /* Feed页 */
    .feed-page {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      z-index: 1000;
      display: none;
    }

    .feed-page.active { display: block; }

    .feed-container {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .feed-container::-webkit-scrollbar { display: none; }

    .feed-item {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
    }

    .feed-item video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-height: 100vh;
      max-width: 100vw;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .feed-item video {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: cover;
      }
    }

    .feed-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      font-size: 24px;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feed-index {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 1001;
    }

    .feed-title {
      position: absolute;
      bottom: 100px;
      left: 16px;
      right: 80px;
      color: #fff;
      font-size: 15px;
      line-height: 1.5;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .feed-like {
      position: absolute;
      bottom: 80px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 1001;
    }

    .feed-like-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: transform 0.2s, background 0.2s;
      color: var(--like-inactive);
    }

    .feed-like-btn:active { transform: scale(0.9); }
    .feed-like-btn.liked { background: var(--like-color); color: #fff; }

    .feed-like-count {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* My Picks 弹窗 */
    .picks-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .picks-modal.active { display: flex; }

    .picks-content {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .picks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .picks-header h2 { color: var(--text-primary); font-size: 20px; }

    .picks-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .picks-empty { text-align: center; color: var(--text-secondary); padding: 40px 0; }

    .picks-carousel {
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      overflow-x: auto;
      padding: 10px 0 14px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .picks-carousel::-webkit-scrollbar { display: none; }

    .picks-carousel::after {
      content: '';
      flex: 0 0 4px;
    }

    .picks-scroll-hint {
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    .picks-scroll-hint.show { display: block; }

    .pick-item { flex-shrink: 0; width: 120px; scroll-snap-align: start; }

    .pick-item video {
      width: 120px;
      aspect-ratio: 9/16;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
    }

    .pick-item-label { text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>


  <!-- 网格页 -->
  <div class="grid-page" id="gridPage">
    <div class="grid-header">
      <h1>Demo列表</h1>
      <div class="grid-actions">
        <button class="action-btn" id="themeBtn" title="切换主题">&#9790;</button>
        <button class="action-btn" id="picksBtn" title="我的收藏">&#9829;</button>
      </div>
    </div>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <!-- Feed页 -->
  <div class="feed-page" id="feedPage">
    <button class="feed-close" id="feedClose">&#8592;</button>
    <div class="feed-index" id="feedIndex">1 / <span id="totalCount">0</span></div>
    <div class="feed-container" id="feedContainer"></div>
  </div>

  <!-- My Picks 弹窗 -->
  <div class="picks-modal" id="picksModal">
    <div class="picks-content">
      <div class="picks-header">
        <h2>我的收藏</h2>
        <button class="picks-close" id="picksClose">&#10005;</button>
      </div>
      <div class="picks-list" id="picksList"></div>
    </div>
  </div>

  <!-- 预加载配置 -->
  

  <script>
    // 配置和视频列表（从config.json加载）
    let VIDEOS = [];
    let COS_BASE = '';
    let videoList = [];

    async function loadConfig() {
      try {
        const res = await fetch('/api/video-list');
        const json = await res.json(); const config = json.data;
        VIDEOS = config.videos;
        COS_BASE = config.cosBase;
        videoList = VIDEOS.map((src, i) => ({
          index: i,
          key: src,
          src: src,
          title: `助手${i + 1}`,
          cosUrl: COS_BASE + src
        }));
      } catch (e) {
        console.error('Failed to load config:', e);
      }
    }

    // 主题管理 - 默认dark
    const ThemeManager = {
      STORAGE_KEY: 'video_feed_theme',
      init() {
        const saved = localStorage.getItem(this.STORAGE_KEY) || 'dark';
        this.setTheme(saved);
        document.getElementById('themeBtn').addEventListener('click', () => this.toggle());
      },
      setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeBtn').innerHTML = theme === 'dark' ? '&#9790;' : '&#9728;';
        localStorage.setItem(this.STORAGE_KEY, theme);
      },
      toggle() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        this.setTheme(current === 'dark' ? 'light' : 'dark');
      }
    };

    // 点赞管理（按视频文件名隔离，换视频自动重置）
    const LikeManager = {
      LOCAL_KEY: 'video_feed_likes',
      COUNTS_KEY: 'video_feed_counts',
      counts: {},
      async init() {
        await this.syncFromServer();
        await this.fetchCounts();
      },
      async syncFromServer() {
        try {
          const res = await fetch('/video-feed/api.php?action=get_likes');
          const data = await res.json();
          if (data.success && data.likes) {
            localStorage.setItem(this.LOCAL_KEY, JSON.stringify(data.likes));
          }
        } catch (e) {}
      },
      async fetchCounts() {
        try {
          const res = await fetch('/video-feed/api.php?action=get_counts');
          const data = await res.json();
          if (data.success && data.counts) {
            this.counts = data.counts;
            localStorage.setItem(this.COUNTS_KEY, JSON.stringify(data.counts));
          }
        } catch (e) {
          try { this.counts = JSON.parse(localStorage.getItem(this.COUNTS_KEY) || '{}'); }
          catch {}
        }
      },
      getLikes() {
        try { return JSON.parse(localStorage.getItem(this.LOCAL_KEY) || '[]'); }
        catch { return []; }
      },
      saveLikes(likes) {
        localStorage.setItem(this.LOCAL_KEY, JSON.stringify(likes));
      },
      isLiked(key) { return this.getLikes().includes(key); },
      async toggle(key) {
        const likes = this.getLikes();
        const pos = likes.indexOf(key);
        let liked;
        if (pos > -1) { likes.splice(pos, 1); liked = false; }
        else { likes.push(key); liked = true; }
        this.saveLikes(likes);
        // 乐观更新本地计数
        this.counts[key] = (this.counts[key] || 0) + (liked ? 1 : -1);
        if (this.counts[key] < 0) this.counts[key] = 0;
        try {
          await fetch('/video-feed/api.php?action=like', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ video_key: key, liked: liked })
          });
        } catch (e) {}
        return liked;
      },
      getCount(key) { return this.counts[key] || 0; }
    };

    // 直接展示（无需密码）
    document.getElementById("passwordPage")?.remove();
    loadConfig().then(() => {
      document.getElementById("gridPage").classList.add("active");
      renderGrid();
    });
    });

    // 渲染网格
    function renderGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = videoList.map(v => `
        <div class="grid-item ${LikeManager.isLiked(v.key) ? 'liked' : ''}" data-index="${v.index}" data-key="${v.key}">
          <div class="grid-item-video">
            <div class="loading-spinner show"></div>
            <video src="${v.cosUrl}" muted loop playsinline preload="auto"></video>
          </div>
          <div class="grid-item-info">
            <div class="grid-item-title">${v.title}</div>
            <div class="grid-item-like-wrap">
              <span class="grid-item-like ${LikeManager.isLiked(v.key) ? 'liked' : ''}" data-key="${v.key}">&#9829;</span>
              <span class="grid-item-count">${LikeManager.getCount(v.key) > 0 ? LikeManager.getCount(v.key) : ''}</span>
            </div>
          </div>
        </div>
      `).join('');

      // 绑定视频加载事件
      grid.querySelectorAll('video').forEach(video => {
        const spinner = video.parentElement.querySelector('.loading-spinner');
        video._wasLoaded = false;
        const hideSpinner = () => {
          if (spinner) spinner.classList.remove('show');
          video._wasLoaded = true;
        };
        const showSpinner = () => {
          if (spinner && !video._wasLoaded) spinner.classList.add('show');
        };

        video.addEventListener('loadeddata', hideSpinner);
        video.addEventListener('canplay', hideSpinner);
        video.addEventListener('playing', hideSpinner);
        video.addEventListener('waiting', showSpinner);
        video.addEventListener('stalled', showSpinner);
        video.addEventListener('error', hideSpinner);

        if (video.readyState >= 2) hideSpinner();
      });

      // 点赞点击
      grid.querySelectorAll('.grid-item-like').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const key = btn.dataset.key;
          const liked = await LikeManager.toggle(key);
          btn.classList.toggle('liked', liked);
          btn.closest('.grid-item').classList.toggle('liked', liked);
          // 更新计数
          const count = LikeManager.getCount(key);
          const countEl = btn.parentElement.querySelector('.grid-item-count');
          if (countEl) countEl.textContent = count > 0 ? count : '';
        });
      });

      // 点击进入feed
      grid.querySelectorAll('.grid-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('grid-item-like')) return;
          openFeed(parseInt(item.dataset.index));
        });
      });

      // hover播放
      grid.querySelectorAll('video').forEach(video => {
        video.addEventListener('mouseenter', () => video.play().catch(() => {}));
        video.addEventListener('mouseleave', () => video.pause());
      });
    }

    // 渲染Feed
    function renderFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = videoList.map(v => `
        <div class="feed-item" data-index="${v.index}" data-key="${v.key}">
          <div class="loading-spinner show"></div>
          <video src="${v.cosUrl}" muted loop playsinline preload="auto"></video>
          <div class="feed-title">${v.title}</div>
          <div class="feed-like">
            <button class="feed-like-btn ${LikeManager.isLiked(v.key) ? 'liked' : ''}" data-key="${v.key}">&#9829;</button>
            <span class="feed-like-count">${LikeManager.getCount(v.key) > 0 ? LikeManager.getCount(v.key) : ''}</span>
          </div>
        </div>
      `).join('');

      // 绑定视频加载事件
      container.querySelectorAll('video').forEach(video => {
        const spinner = video.parentElement.querySelector('.loading-spinner');
        video._wasLoaded = false;
        const hideSpinner = () => {
          if (spinner) spinner.classList.remove('show');
          video._wasLoaded = true;
        };
        const showSpinner = () => {
          if (spinner && !video._wasLoaded) spinner.classList.add('show');
        };

        video.addEventListener('loadeddata', hideSpinner);
        video.addEventListener('canplay', hideSpinner);
        video.addEventListener('playing', hideSpinner);
        video.addEventListener('waiting', showSpinner);
        video.addEventListener('stalled', showSpinner);
        video.addEventListener('error', hideSpinner);

        if (video.readyState >= 2) hideSpinner();
      });

      // 点赞
      container.querySelectorAll('.feed-like-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const key = btn.dataset.key;
          const liked = await LikeManager.toggle(key);
          btn.classList.toggle('liked', liked);
          const count = LikeManager.getCount(key);
          btn.nextElementSibling.textContent = count > 0 ? count : '';
        });
      });

      // 滚动切换
      let currentIndex = 0;
      const items = container.querySelectorAll('.feed-item');
      const feedVideos = container.querySelectorAll('video');

      function updateIndex() {
        const scrollTop = container.scrollTop;
        const viewportHeight = window.innerHeight;
        currentIndex = Math.round(scrollTop / viewportHeight);
        document.getElementById('feedIndex').innerHTML = `${currentIndex + 1} / <span id="totalCount">${videoList.length}</span>`;
      }

      container.addEventListener('scroll', () => {
        updateIndex();
        feedVideos.forEach((v, i) => {
          if (i === currentIndex) {
            v.play().catch(() => {});
          } else {
            v.pause();
          }
        });
      });
    }

    // 打开Feed
    function openFeed(index) {
      document.getElementById('feedPage').classList.add('active');
      // 刷新点赞状态和计数
      document.querySelectorAll('.feed-like-btn').forEach(btn => {
        const key = btn.dataset.key;
        if (key) btn.classList.toggle('liked', LikeManager.isLiked(key));
      });
      document.querySelectorAll('.feed-like-count').forEach(el => {
        const btn = el.parentElement.querySelector('.feed-like-btn');
        if (btn) {
          const key = btn.dataset.key;
          if (key) {
            const count = LikeManager.getCount(key);
            el.textContent = count > 0 ? count : '';
          }
        }
      });
      const container = document.getElementById('feedContainer');
      container.scrollTop = index * window.innerHeight;

      setTimeout(() => {
        const feedVideos = container.querySelectorAll('video');
        feedVideos[index]?.play().catch(() => {});
      }, 100);
    }

    // 刷新网格点赞状态（不重建DOM，不重载视频）
    function refreshGridLikes() {
      document.querySelectorAll('.grid-item-like').forEach(btn => {
        const key = btn.dataset.key;
        if (key) btn.classList.toggle('liked', LikeManager.isLiked(key));
      });
      document.querySelectorAll('.grid-item').forEach(item => {
        const key = item.dataset.key;
        if (key) item.classList.toggle('liked', LikeManager.isLiked(key));
      });
      document.querySelectorAll('.grid-item-count').forEach(el => {
        const btn = el.parentElement.querySelector('.grid-item-like');
        if (btn) {
          const key = btn.dataset.key;
          if (key) {
            const count = LikeManager.getCount(key);
            el.textContent = count > 0 ? count : '';
          }
        }
      });
    }

    // 关闭Feed
    document.getElementById('feedClose').addEventListener('click', () => {
      document.getElementById('feedPage').classList.remove('active');
      document.querySelectorAll('#feedContainer video').forEach(v => v.pause());
      refreshGridLikes();
    });

    // My Picks
    function showPicks() {
      const likes = LikeManager.getLikes();
      const list = document.getElementById('picksList');

      if (likes.length === 0) {
        list.innerHTML = '<div class="picks-empty">还没有收藏哦~<br>点击爱心收藏喜欢的视频</div>';
      } else {
        const likedVideos = likes.map(key => videoList.find(v => v.key === key)).filter(Boolean);
        if (likedVideos.length === 0) {
          list.innerHTML = '<div class="picks-empty">还没有收藏哦~<br>点击爱心收藏喜欢的视频</div>';
        } else {
          list.innerHTML = `
            <div class="picks-carousel">
              ${likedVideos.map(v =>
                `<div class="pick-item"><video src="${v.cosUrl}" muted loop playsinline></video><div class="pick-item-label">${v.title}</div></div>`
              ).join('')}
            </div>
            <div class="picks-scroll-hint ${likedVideos.length > 3 ? 'show' : ''}">← 左右滑动查看更多 →</div>
          `;
          list.querySelectorAll('video').forEach(v => v.play().catch(() => {}));
        }
      }

      document.getElementById('picksModal').classList.add('active');
    }

    document.getElementById('picksBtn').addEventListener('click', showPicks);
    document.getElementById('picksClose').addEventListener('click', () => {
      document.getElementById('picksModal').classList.remove('active');
    });
    document.getElementById('picksModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('picksModal')) {
        document.getElementById('picksModal').classList.remove('active');
      }
    });
  </script>
</body>
</html>
