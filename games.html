<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏 - 创想世界</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-elevated: #141414;
            --border: #262626;
            --text: #ffffff;
            --text-secondary: #737373;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        header { padding: 32px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 14px; font-weight: 500; letter-spacing: 0.2em; color: var(--text-secondary); text-transform: uppercase; }
        .back { color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .back:hover { color: var(--text); }
        .hero { padding: 80px 0; }
        .hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }
        .hero p { color: var(--text-secondary); font-size: 1.1rem; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; margin-bottom: 80px; }
        .game-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
        .game-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .game-img { width: 100%; height: 180px; object-fit: cover; }
        .game-content { padding: 24px; }
        .game-card h3 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
        .game-card p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
        .tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { font-size: 11px; font-weight: 500; padding: 4px 10px; background: var(--surface-elevated); border-radius: 4px; color: var(--text-secondary); }
        footer { padding: 40px 0; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 14px; text-align: center; }
        @media(max-width:640px){ .games-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back">← 返回</a>
            <p class="logo">创想世界</p>
        </header>
        <section class="hero">
            <h1>游戏</h1>
            <p>HTML5 互动体验</p>
        </section>
        <div class="games-grid">
            <div class="game-card" onclick="location.href='game.html'">
                <img class="game-img" src="https://images.unsplash.com/photo-1614680376593-902f74cf0d41?w=600&q=80" alt="行动代号">
                <div class="game-content">
                    <h3>行动代号</h3>
                    <p>双人对战猜词游戏，AI生成词库，多种主题</p>
                    <div class="tags">
                        <span class="tag">双人</span>
                        <span class="tag">AI</span>
                        <span class="tag">桌游</span>
                    </div>
                </div>
            </div>
            <div class="game-card" onclick="location.href='truth-or-dare/'">
                <img class="game-img" src="truth-or-dare/preview.png" alt="真心话">
                <div class="game-content">
                    <h3>真心话</h3>
                    <p>抽一张签、答一题真心话，情侣朋友聚会破冰小游戏</p>
                    <div class="tags">
                        <span class="tag">情侣</span>
                        <span class="tag">聚会</span>
                        <span class="tag">抽签</span>
                    </div>
                </div>
            </div>
            <div class="game-card" onclick="location.href='couple-flight-chess/'">
                <img class="game-img" src="couple-flight-chess/preview.svg" alt="情侣飞行棋">
                <div class="game-content">
                    <h3>情侣飞行棋</h3>
                    <p>掷骰子走格子，真心话大冒险，让感情快速升温</p>
                    <div class="tags">
                        <span class="tag">情侣</span>
                        <span class="tag">飞行棋</span>
                        <span class="tag">真心话</span>
                    </div>
                </div>
            </div>
            <div class="game-card">
                <img class="game-img" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600&q=80" alt="即将上线">
                <div class="game-content">
                    <h3>即将上线</h3>
                    <p>更多游戏正在准备中</p>
                    <div class="tags">
                        <span class="tag">即将上线</span>
                    </div>
                </div>
            </div>
        </div>
        <footer><p>© 2026 创想世界</p></footer>
    </div>
</body>
</html>
