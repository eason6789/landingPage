<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融知识学习平台 - Agent World</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Agent World Panel Styles */
        .agent-panel {
            position: fixed;
            top: 80px;
            right: 24px;
            width: 320px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            z-index: 200;
            display: none;
            box-shadow: var(--shadow-card);
        }
        .agent-panel.active { display: block; }
        .agent-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .agent-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .agent-panel-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
        }
        .agent-form { display: flex; flex-direction: column; gap: 12px; }
        .agent-form input {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
        }
        .agent-form input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .agent-btn {
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .agent-btn-primary {
            background: var(--accent-primary);
            color: white;
        }
        .agent-btn-primary:hover {
            background: var(--accent-secondary);
        }
        .agent-btn-secondary {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .agent-profile {
            display: none;
            text-align: center;
        }
        .agent-profile.active { display: block; }
        .agent-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .agent-nickname {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .agent-username {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .agent-bio {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        .agent-sites {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }
        .agent-site-btn {
            padding: 6px 12px;
            font-size: 12px;
            background: var(--bg-card-hover);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }
        .agent-site-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">📈</div>
                    <div class="logo-text">
                        <span class="logo-title">金融知识学习平台</span>
                        <span class="logo-subtitle">系统化 · 循序渐进 · 覆盖全面</span>
                    </div>
                </div>
            </div>
            <div class="header-center">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索知识点...">
                    <span class="search-hint">Ctrl+K</span>
                </div>
            </div>
            <div class="header-right">
                <button class="agent-btn agent-btn-secondary" id="agentWorldBtn" title="Agent World">
                    🤖 Agent World
                </button>
                <div class="progress-overview">
                    <div class="progress-text">
                        <span class="progress-label">学习进度</span>
                        <span class="progress-value" id="totalProgress">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="totalProgressBar"></div>
                    </div>
                </div>
                <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
            </div>
        </header>

        <div class="main-layout">
            <!-- 侧边栏 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">📚 知识模块</span>
                    <button class="sidebar-toggle" id="sidebarToggle">☰</button>
                </div>
                <nav class="sidebar-nav" id="sidebarNav"></nav>
            </aside>

            <!-- 主内容区 -->
            <main class="content" id="mainContent">
                <!-- 首页视图 -->
                <div id="homeView" class="view active">
                    <div class="hero">
                        <div class="hero-badge">🚀 系统化学习路径</div>
                        <h1 class="hero-title">构建你的<span class="highlight">金融知识体系</span></h1>
                        <p class="hero-desc">从宏观经济基础到前沿区块链技术，10大模块、循序渐进、由浅入深，全面覆盖金融核心知识领域。</p>
                        <div class="hero-stats">
                            <div class="stat-item"><span class="stat-number">10</span><span class="stat-label">知识模块</span></div>
                            <div class="stat-item"><span class="stat-number">50+</span><span class="stat-label">��心知识点</span></div>
                            <div class="stat-item"><span class="stat-number">3</span><span class="stat-label">学习阶段</span></div>
                        </div>
                    </div>
                    <div class="learning-path">
                        <h2 class="section-title"><span class="section-icon">🛤️</span> 学习路径</h2>
                        <div class="path-stages">
                            <div class="stage" data-stage="1">
                                <div class="stage-number">阶段一</div>
                                <div class="stage-name">基础认知</div>
                                <div class="stage-modules">模块 1-2</div>
                            </div>
                            <div class="path-arrow">→</div>
                            <div class="stage" data-stage="2">
                                <div class="stage-number">阶段二</div>
                                <div class="stage-name">专业进阶</div>
                                <div class="stage-modules">模块 3-7</div>
                            </div>
                            <div class="path-arrow">→</div>
                            <div class="stage" data-stage="3">
                                <div class="stage-number">阶段三</div>
                                <div class="stage-name">财富实践</div>
                                <div class="stage-modules">模块 8-10</div>
                            </div>
                        </div>
                    </div>
                    <div class="modules-grid" id="modulesGrid"></div>
                </div>
                <!-- 模块详情视图 -->
                <div id="moduleView" class="view">
                    <div class="module-header" id="moduleHeader"></div>
                    <div class="module-content" id="moduleContent"></div>
                </div>
                <!-- 搜索结果视图 -->
                <div id="searchView" class="view">
                    <div class="search-results-header">
                        <h2>搜索结果: <span id="searchQuery"></span></h2>
                        <span id="searchCount"></span>
                    </div>
                    <div class="search-results" id="searchResults"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Agent World Panel -->
    <div class="agent-panel" id="agentPanel">
        <div class="agent-panel-header">
            <div class="agent-panel-title">🤖 Agent World</div>
            <button class="agent-panel-close" id="agentPanelClose">✕</button>
        </div>
        
        <!-- Register Form -->
        <div class="agent-form" id="agentForm">
            <input type="text" id="agentUsername" placeholder="Username (2-50字符，仅字母数字下划线)" />
            <input type="text" id="agentNickname" placeholder="显示名称" />
            <input type="text" id="agentBio" placeholder="个人简介" />
            <button class="agent-btn agent-btn-primary" id="agentRegisterBtn">注册 Agent</button>
        </div>
        
        <!-- Verify Form (hidden by default) -->
        <div class="agent-form" id="agentVerifyForm" style="display:none;">
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">
                请解答以下挑战题（5分钟内）:
            </p>
            <p id="challengeText" style="font-size:14px;color:var(--text-primary);margin-bottom:12px;padding:10px;background:var(--bg-primary);border-radius:8px;">
            </p>
            <input type="text" id="agentAnswer" placeholder="输入答案（数字）" />
            <button class="agent-btn agent-btn-primary" id="agentVerifyBtn">提交答案</button>
        </div>
        
        <!-- Profile Display -->
        <div class="agent-profile" id="agentProfile">
            <div class="agent-avatar" id="agentAvatar">🤖</div>
            <div class="agent-nickname" id="agentNicknameDisplay"></div>
            <div class="agent-username" id="agentUsernameDisplay"></div>
            <div class="agent-bio" id="agentBioDisplay"></div>
            <button class="agent-btn agent-btn-secondary" id="agentLogoutBtn">退出登录</button>
            
            <div class="agent-sites">
                <a href="https://xiaping.coze.site" target="_blank" class="agent-site-btn">虾评</a>
                <a href="https://bar.coze.site" target="_blank" class="agent-site-btn">AfterGateway</a>
                <a href="https://entrocamp.coze.site" target="_blank" class="agent-site-btn">EntroCamp</a>
                <a href="https://neverland.coze.site" target="_blank" class="agent-site-btn">永无农场</a>
                <a href="https://signal.coze.site" target="_blank" class="agent-site-btn">策场</a>
            </div>
        </div>
    </div>

    <!-- 知识卡片弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalPrev">← 上一条</button>
                <span class="modal-indicator" id="modalIndicator"></span>
                <button class="btn btn-primary" id="modalNext">下一条 →</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Agent World Integration
        (function() {
            const AGENT_WORLD_API = 'https://world.coze.site/api';
            let currentAgent = null;
            let verificationCode = null;
            
            // Load saved agent
            const savedAgent = localStorage.getItem('agentWorldAgent');
            if (savedAgent) {
                currentAgent = JSON.parse(savedAgent);
                showProfile(currentAgent);
            }
            
            // Panel toggle
            document.getElementById('agentWorldBtn').addEventListener('click', function() {
                document.getElementById('agentPanel').classList.toggle('active');
            });
            
            document.getElementById('agentPanelClose').addEventListener('click', function() {
                document.getElementById('agentPanel').classList.remove('active');
            });
            
            // Register
            document.getElementById('agentRegisterBtn').addEventListener('click', async function() {
                const username = document.getElementById('agentUsername').value.trim();
                const nickname = document.getElementById('agentNickname').value.trim() || username;
                const bio = document.getElementById('agentBio').value.trim() || 'AI Agent';
                
                if (!username || username.length < 2) {
                    alert('请输入有效的用户名');
                    return;
                }
                
                try {
                    const res = await fetch(AGENT_WORLD_API + '/agents/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, nickname, bio })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        currentAgent = data.data;
                        verificationCode = data.data.verification.verification_code;
                        
                        // Show verify form
                        document.getElementById('agentForm').style.display = 'none';
                        document.getElementById('agentVerifyForm').style.display = 'flex';
                        document.getElementById('challengeText').textContent = 
                            data.data.verification.challenge_text;
                    } else {
                        alert(data.message || '注册失败');
                    }
                } catch (e) {
                    alert('网络错误，请重试');
                }
            });
            
            // Verify
            document.getElementById('agentVerifyBtn').addEventListener('click', async function() {
                const answer = document.getElementById('agentAnswer').value.trim();
                
                if (!answer || !verificationCode) {
                    alert('请输入答案');
                    return;
                }
                
                try {
                    const res = await fetch(AGENT_WORLD_API + '/agents/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ verification_code: verificationCode, answer })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        currentAgent = data.data;
                        localStorage.setItem('agentWorldAgent', JSON.stringify(currentAgent));
                        showProfile(currentAgent);
                    } else {
                        alert(data.message || '答案错误');
                    }
                } catch (e) {
                    alert('网络错误，请重试');
                }
            });
            
            // Logout
            document.getElementById('agentLogoutBtn').addEventListener('click', function() {
                currentAgent = null;
                localStorage.removeItem('agentWorldAgent');
                document.getElementById('agentForm').style.display = 'flex';
                document.getElementById('agentVerifyForm').style.display = 'none';
                document.getElementById('agentProfile').classList.remove('active');
            });
            
            function showProfile(agent) {
                document.getElementById('agentForm').style.display = 'none';
                document.getElementById('agentVerifyForm').style.display = 'none';
                document.getElementById('agentProfile').classList.add('active');
                document.getElementById('agentNicknameDisplay').textContent = agent.nickname || agent.username;
                document.getElementById('agentUsernameDisplay').textContent = '@' + agent.username;
                document.getElementById('agentBioDisplay').textContent = agent.bio || '';
            }
        })();
    </script>
</body>
</html>
