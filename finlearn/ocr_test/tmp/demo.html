<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1-宏观经济学 · OCR演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Noto Sans SC',-apple-system,sans-serif;background:#0f172a;color:#e2e8f0}
.header{background:#1e293b;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155}
.header h1{font-size:17px;display:flex;align-items:center;gap:10px}
.header h1 span{font-size:28px}
.badge{font-size:11px;background:#3b82f6;padding:4px 10px;border-radius:10px;color:#fff}
.stats{font-size:12px;color:#94a3b8;display:flex;gap:20px}
.stats b{color:#e2e8f0}
.container{display:flex;height:calc(100vh - 52px)}
.panel{flex:1;overflow-y:auto;padding:24px 32px}
.panel-left{background:#fff;color:#1a1a2e;border-right:2px solid #e5e7eb}
.panel-right{background:#f8fafc;color:#334155}
.panel-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid}
.panel-left .panel-label{color:#3b82f6;border-color:#3b82f6}
.panel-right .panel-label{color:#10b981;border-color:#10b981}
.ocr-content{font-size:14px;line-height:1.85}
.ocr-content h1{font-size:22px;margin:20px 0 10px;color:#0f172a;padding-bottom:6px;border-bottom:1px solid #e5e7eb}
.ocr-content h2{font-size:18px;margin:16px 0 8px;color:#1e293b}
.ocr-content h3{font-size:16px;margin:14px 0 6px;color:#334155}
.ocr-content p{margin:6px 0}
.ocr-content ul,.ocr-content ol{margin:6px 0;padding-left:22px}
.ocr-content li{margin:3px 0}
.ocr-content table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.ocr-content th,.ocr-content td{border:1px solid #d1d5db;padding:6px 10px;text-align:left;vertical-align:top}
.ocr-content th{background:#f1f5f9;font-weight:600;font-size:12px;color:#475569}
.ocr-content hr{border:none;border-top:1px dashed #cbd5e1;margin:20px 0}
.ocr-content strong{color:#2563eb}
.loading{text-align:center;padding:60px;color:#9ca3af;font-size:16px}
.trans-placeholder{text-align:center;padding:80px 20px;color:#9ca3af}
.trans-placeholder .icon{font-size:48px;margin-bottom:12px}
.trans-placeholder p{font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="header">
  <h1><span>📖</span> 1-宏观经济学 · OCR识别结果</h1>
  <div class="stats">原图: 1810×30125px | 识别文字: <b id="charCount">-</b>字 | 模型: GLM-4.6V + Qwen-VL-Max</div>
  <span class="badge">测试演示 v1</span>
</div>
<div class="container">
  <div class="panel panel-left">
    <div class="panel-label">📋 左侧：原图文字（逐字还原 · 中英对照）</div>
    <div class="ocr-content" id="leftContent">
      <div class="loading">⏳ 加载中...</div>
    </div>
  </div>
  <div class="panel panel-right">
    <div class="panel-label">🌐 右侧：内容对照 / 补充说明</div>
    <div class="trans-placeholder" id="rightContent">
      <div class="icon">💡</div>
      <p>右侧栏目目前展示内容说明：</p>
      <p style="font-size:13px;margin-top:8px">原始截图中的文字已经是<strong>中英双语</strong><br>
      左栏完整呈现了OCR识别的全部内容<br>
      包括标题层级、表格数据、指标说明等</p>
    </div>
  </div>
</div>
<script>
function renderMarkdown(md) {
  let html = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Tables
  html = html.replace(/\|(.+)\|\n\|[- |:]+\|\n((?:\|.+\|\n?)+)/gm, function(_, header, body) {
    var hs = header.split('|').filter(function(h){return h.trim()}).map(function(h){return '<th>'+h.trim()+'</th>'}).join('');
    var rows = body.trim().split('\n').map(function(row){
      var cells = row.split('|').filter(function(c){return c.trim()}).map(function(c){return '<td>'+c.trim()+'</td>'}).join('');
      return '<tr>'+cells+'</tr>';
    }).join('');
    return '<table><thead><tr>'+hs+'</tr></thead><tbody>'+rows+'</tbody></table>';
  });

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(\s*<br>\s*)+<\/p>/g, '');

  return html;
}

fetch('ocr_final_data.json')
  .then(function(r){return r.json()})
  .then(function(data){
    document.getElementById('charCount').textContent = (data.chars||0).toLocaleString();
    document.getElementById('leftContent').innerHTML = renderMarkdown(data.content);
  })
  .catch(function(e){
    document.getElementById('leftContent').innerHTML = '<div class="loading">❌ 加载失败: '+e.message+'</div>';
  });
</script>
</body>
</html>
